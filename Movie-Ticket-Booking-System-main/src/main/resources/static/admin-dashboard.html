<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard · CineMax</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 1rem; }
    .form-grid .full { grid-column: 1 / -1; }
    @media (max-width: 640px) { .form-grid { grid-template-columns: 1fr; } }
    .modal .modal-foot { border-top: 1px solid var(--border); padding-top: 1rem; }
    pre.out { white-space: pre-wrap; word-break: break-word; font-size: .85rem; }
  </style>
</head>
<body>
  <div class="admin-shell">
    <aside class="sidebar">
      <a class="brand" href="index.html" style="margin-bottom:1rem"><span class="logo">🎬</span><span>CineMax Admin</span></a>
      <nav id="sideNav" style="display:flex;flex-direction:column;gap:.3rem"></nav>
      <div style="margin-top:auto;display:grid;gap:.6rem">
        <a class="btn btn-ghost btn-sm" href="index.html">View public site</a>
        <button class="btn btn-danger btn-sm" id="logoutBtn">Log out</button>
      </div>
    </aside>

    <main class="admin-main">
      <div class="toolbar">
        <div>
          <h1 id="sectionTitle">Dashboard</h1>
          <p id="sectionOwner" class="muted" style="margin:0"></p>
        </div>
      </div>
      <div id="sectionBody"><div class="loader">Loading…</div></div>
    </main>
  </div>

  <!-- Generic create / edit dialog used by every CRUD section -->
  <div class="modal-backdrop" id="modal">
    <div class="card modal">
      <div class="modal-head">
        <h2 id="modalTitle">Form</h2>
        <button class="btn btn-ghost btn-sm" type="button" id="modalClose">✕</button>
      </div>
      <form id="modalForm"></form>
    </div>
  </div>

  <div class="toast-wrap"></div>

  <script src="js/common.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
