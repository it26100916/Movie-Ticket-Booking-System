# ---------- Application ----------
spring.application.name=movie-ticket-booking
server.port=8070

# ---------- SQL database (default: H2 file database, no installation needed) ----------
# Data is stored in ./data/moviebooking.mv.db and survives restarts.
# To use MySQL instead, run:  mvn spring-boot:run -Dspring-boot.run.profiles=mysql
spring.datasource.url=jdbc:h2:file:./data/moviebooking;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# H2 web console: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:file:./data/moviebooking)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------- JSON ----------
spring.jackson.serialization.write-dates-as-timestamps=false

# ---------- File handling (read seed files / write reports) ----------
app.data.seed-dir=data/seed
app.data.reports-dir=data/reports
app.currency=LKR
