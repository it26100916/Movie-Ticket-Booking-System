# ---------- MySQL profile ----------
# 1. Create nothing manually: the database is created automatically if the user has rights.
# 2. Start with:  mvn spring-boot:run -Dspring-boot.run.profiles=mysql
#    (set DB_USER / DB_PASS environment variables if your MySQL login is not root/root)
spring.datasource.url=jdbc:mysql://localhost:3306/movie_booking?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Colombo
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.h2.console.enabled=false
