<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Login · CineMax</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="topbar" class="topbar"></header>

  <main class="auth-wrap">
    <div class="card auth-card">
      <span class="badge badge-std tag">Customer portal</span>
      <h1>Welcome back</h1>
      <p>Log in to book seats, pay and manage your bookings.</p>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" required placeholder="you@example.com" autocomplete="username">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" required autocomplete="current-password">
        </div>
        <div class="error-text" id="error"></div>
        <button class="btn btn-primary btn-block" id="submitBtn" type="submit">Log in</button>
      </form>

      <p class="mt-2" style="text-align:center">New here? <a href="customer-register.html">Create an account</a></p>
      <p style="text-align:center;font-size:.85rem">Staff member? <a href="admin-login.html">Admin login</a></p>
      <p class="hint mt-2">Demo customer: customer@cinema.lk / customer123</p>
    </div>
  </main>

  <script src="js/common.js"></script>
  <script>
    /* Member 1 (User & Authentication) UI: customer login */
    renderNav('');
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const error = document.getElementById('error');
      const button = document.getElementById('submitBtn');
      error.textContent = '';
      button.disabled = true;
      try {
        await API.post('/api/auth/customer/login', {
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value
        });
        window.location.href = nextPage('index.html');
      } catch (err) {
        error.textContent = err.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
